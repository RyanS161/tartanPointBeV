defaults:
  - _self_ 
  - augs@img_params: scale_0_3.yaml

_target_: pointbev.data.datamodule.TartangroundDatamodule

envs: 
 - 'Downtown'
dataroot: ${paths.data_dir}tartanground
hdmaproot: ${paths.data_dir}/nuscenes_processed_map
is_lyft: False

# Grid
grid:
  xbound: [-50.0, 50.0, 0.5]
  ybound: [-50.0, 50.0, 0.5]
  zbound: [-10.0, 10.0, 20.0]
  dbound: [4.0, 45.0, 1.0]

# Images
img_loader:
  _target_: pointbev.utils.imgs.ImageLoader
  mode: PIL

img_params:
  H: 640
  W: 640
  cams:
    # - 'lcam_front'
    # - 'lcam_back'
    # - 'lcam_left'
    # - 'lcam_right'
    # - 'lcam_top'
    # - 'lcam_bottom'
    - 'lcam_front'
    - 'lcam_front_right'
    - 'lcam_front_left'
    - 'lcam_back_right'
    - 'lcam_back_left'
    - 'lcam_back'
  Ncams: 6
  update_intrinsics: True
  downsample: ${model.net.backbone.downsample}

# Coefficients
coeffs:
  bev_aug:
    trans_rot: [30.,20.,0.,20.,0.,0.]

# Dataloader
batch_size: 1
valid_batch_size: ${data.batch_size}
num_workers: 16
pin_memory: True
prefetch_factor: 2
train_drop_last: True
train_shuffle: True

# Inputs.
normalize_img: True 
# requires me to either have the binimg or hdmap set to True (which makes sense since otherwise there's no lable for the task)
keep_input_binimg: True  # was True
keep_input_centr_offs: False # was True
keep_input_detection: False
keep_input_hdmap: False
hdmap_names: ['drivable_area']
keep_input_persp: False
keep_input_sampling: False
keep_input_offsets_map: False
keep_input_lidar: False
save_folder: ""
visualise_mode: False

# Multi-scale
kernel_scales: [1]

# Temporal
cam_T_P: [[0,0]]
bev_T_P: [[0,0]]
mode_ref_cam_T: 'present'

# Filters
only_object_center_in: false
filters_cat: ['vehicle']